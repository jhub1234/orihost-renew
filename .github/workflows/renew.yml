name: Orihost Auto Renew

on:
  schedule:
    # 每 3 天一次，UTC 10:00 = 北京时间 18:00
    - cron: '0 10 */3 * *'
  workflow_dispatch: # 支持手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium --with-deps

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          nohup bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh) > proxy.log 2>&1 &
          sleep 6
          cat proxy.log || true

      - name: Run Orihost Renew
        env:
          # 单账号配置
          ORIHOST_USERNAME: ${{ secrets.ORIHOST_USERNAME }}
          ORIHOST_PASSWORD: ${{ secrets.ORIHOST_PASSWORD }}
          ORIHOST_SERVER_IDS: ${{ secrets.ORIHOST_SERVER_IDS }}

          # 多账号支持
          ORIHOST_USERNAME_1: ${{ secrets.ORIHOST_USERNAME_1 }}
          ORIHOST_PASSWORD_1: ${{ secrets.ORIHOST_PASSWORD_1 }}
          ORIHOST_SERVER_IDS_1: ${{ secrets.ORIHOST_SERVER_IDS_1 }}

          # 通用配置
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          # 使用实际生效的 SOCKS5 端口
          ORIHOST_PROXY: socks5://127.0.0.1:1080
        run: python -u orihost_renew.py
